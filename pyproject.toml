[project]
name = "cdsci-lake"
version = "0.2.1"
description = "Shared DuckLake platform: read client + bulk source ingestors for the cdsci research-data lake"
readme = "README.md"
authors = [{ name = "Sean Davis", email = "seandavi@gmail.com" }]
# 3.11 is the floor a read-client consumer must satisfy (omicidx runs 3.12); the
# code uses no 3.12+/3.13+ syntax. Keeping this low lets peer producers whose
# workspaces declare >=3.11 resolve the read client.
requires-python = ">=3.11"
# Base install = the READ CLIENT (+ the write path: lake_connect/upsert/ops).
# Consumers attach the lake and query; that's all they need. Credentials come from
# Google Secret Manager via the `gcloud` CLI. NO CLI deps here — `typer` is used
# only by the ingest/maintenance CLIs and lives in `[ingest]`, so a consumer (e.g.
# omicidx, whose prefect pins typer<0.25) isn't forced onto a conflicting typer.
dependencies = [
    "duckdb>=1.5.3",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.1",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
# Platform-side only: the bulk source ingestors + the ingest/maintenance CLIs.
ingest = [
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "typer>=0.26.7",
    "pytz>=2025.1",  # DuckDB needs it to return tz-timestamps (maintenance result sets)
]
dashboard = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
# The transform + reverse-ETL layer (ADR-0015). sqlglot does dependency-graph +
# lineage parsing only — DuckDB (base) stays the sole execution engine; typer is
# the CLI, same floor as [ingest].
transform = [
    "sqlglot>=27",
    "typer>=0.26.7",
]

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# PEP 420 namespace package: `cdsci` is the namespace, `lake` the module. No
# __init__.py at src/cdsci/ — sibling cdsci.* packages may live in other repos.
module-name = "cdsci.lake"
module-root = "src"
namespace = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
flake8-bugbear.extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# Embedded SQL with long ClinicalTrials.gov JSON paths — keep them readable.
"src/cdsci/lake/sources/ctgov/ingest.py" = ["E501"]
# Embedded SQL with long State Cancer Profiles column aliases — keep them readable.
"src/cdsci/lake/sources/scp/ingest.py" = ["E501"]
"src/cdsci/lake/sources/scp/__main__.py" = ["E501"]
# Embedded SQL with long BioC JSON paths — keep them readable.
"src/cdsci/lake/sources/pmc/ingest.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
